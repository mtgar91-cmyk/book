name = "book-library"
main = "worker.js"
compatibility_date = "2026-10-01"

# قاعدة البيانات (SQLite على كلاود فلاير)
[[d1_databases]]
binding = "DB"
database_name = "book-library-db"
database_id = "c966f245-0c56-4521-a4b8-3556883d45bb"

# الذكاء الاصطناعي (Workers AI) - للمرشد الذكي في الموقع
[ai]
binding = "AI"

# متغيرات عادية (غير سرية)
[vars]
BOT_USERNAME = "Fklffffftgbot"
GROUP_ID = "-1003915424473"
USERBOT_ID = "7884538171"
# SITE_URL = "https://example.com"   # فقط إن استخدمت دومين خاص

# الأسرار تضاف من لوحة كلاود فلاير (Settings > Variables and Secrets) أو بالأمر:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
#   wrangler secret put ADMIN_CODE      (رمز لوحة الإدارة؛ أول حساب يرسله للبوت يصبح الأدمن)
